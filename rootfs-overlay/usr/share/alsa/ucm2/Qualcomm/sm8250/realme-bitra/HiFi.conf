# UCM2 HiFi use case for the realme GT Neo 2 (bitra).
#
# Verified on the phone (2026-11-22): the two TFA9874 speaker amplifiers on Tertiary MI2S (top + bottom), reached through the q6routing mixer
# "TERT_MI2S_RX Audio Mixer MultiMedia1" and the MultiMedia1 PCM (hw:CARD,0). The amplifiers have no kernel volume control: PulseAudio's
# software volume is the only volume, keep the default low while testing.
#
# NOT included yet (wiring/behaviour unverified, see docs/31): microphones (WCD938x ADC/DMIC and VA DMIC paths), earpiece, headset / USB-C audio, voice calls.

SectionVerb {
	# The back-end route lives in the VERB sequence (like the RB5 profile): PulseAudio opens the PCM while probing the profile, before it enables
	# any device, and a MultiMedia PCM without a routed back-end fails to open with EINVAL ("no backend DAIs enabled for MultiMedia1").
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers (top + bottom TFA9874 amplifiers)"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
