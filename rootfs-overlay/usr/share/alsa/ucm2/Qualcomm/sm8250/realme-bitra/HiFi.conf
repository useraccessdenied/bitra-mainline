# UCM2 HiFi use case for the realme GT Neo 2 (bitra).
#
# Verified on the phone (2026-11-22): the two TFA9874 speaker amplifiers on Tertiary MI2S (top + bottom), reached through the q6routing mixer
# "TERT_MI2S_RX Audio Mixer MultiMedia1" and the MultiMedia1 PCM (hw:CARD,0). The amplifiers have no kernel volume control: PulseAudio's
# software volume is the only volume, keep the default low while testing.
#
# Microphone: the BOTTOM mic = WCD938x analog input AMIC1 on ADC1 (docs/31; verified with speech and a tap test). The top mic is not found yet.
# NOT included yet (unverified): top mic, earpiece, headset / USB-C audio, voice calls.

SectionVerb {
	# The back-end route lives in the VERB sequence (like the RB5 profile): PulseAudio opens the PCM while probing the profile, before it enables
	# any device, and a MultiMedia PCM without a routed back-end fails to open with EINVAL ("no backend DAIs enabled for MultiMedia1").
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"

		# Capture route (bottom mic, WCD938x ADC1 -> TX macro DEC0 -> TX_CODEC_DMA_TX_3 -> MultiMedia2). It must be applied here, not in the device
		# sequence: PulseAudio opens the capture PCM (starting the SoundWire stream) before it enables the device.
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		# the mic is mono but PulseAudio opens the PCM as stereo: feed the same ADC1 into the second decimator so both channels carry the mic
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		# analog gain 0-20 = 0-30 dB (1.5 dB/step): 16 = +24 dB gives speech around -20 dBFS (step 8 was too quiet for the Phosh input meter)
		cset "name='ADC1 Volume' 16"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers (top + bottom TFA9874 amplifiers)"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Microphone (bottom mic, WCD938x AMIC1 via ADC1)"

	# The capture route lives in the verb sequence (see above).
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
